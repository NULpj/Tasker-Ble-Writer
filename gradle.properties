// Moar memory is required for in-process dex.
org.gradle.jvmargs=-Xmx2g

// Enable automatic download of Android SDK components.
android.builder.sdkDownload=true


// Android build details
ANDROID_BUILD_TOOLS_VERSION=34.0.0
ANDROID_MIN_SDK_VERSION=21
ANDROID_TARGET_SDK_VERSION=34
ANDROID_COMPILE_SDK_VERSION=34


// App version details
ANDROID_VERSION_CODE=2
ANDROID_VERSION_NAME=1.0.1

// Signing configuration
RELEASE_KEYSTORE_PATH=
RELEASE_KEYSTORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_ALIAS_PASSWORD=


// Version matchers for dependencies
ANDROID_GRADLE_PLUGIN_VERSION_MATCHER=8.3.2
ANDROID_SUPPORT_VERSION_MATCHER=1.6.1
JCIP_ANNOTATION_VERSION_MATCHER=1.0
GRADLE_VERSIONS_PLUGIN_VERSION_MATCHER=0.46.0
TWOFORTYFOURAM_ANNOTATION_VERSION_MATCHER=1.0.4
TWOFORTYFOURAM_ASSERTION_VERSION_MATCHER=1.1.1
TWOFORTYFOURAM_PLUGIN_API_VERSION_MATCHER=1.0.5
TWOFORTYFOURAM_PLUGIN_CLIENT_SDK_VERSION_MATCHER=4.0.3
TWOFORTYFOURAM_SPACKLE_VERSION_MATCHER=2.0.3
TWOFORTYFOURAM_TEST_VERSION_MATCHER=1.0.1


// Toggle JaCoCo code coverage reports.
IS_COVERAGE_ENABLED=true

android.useAndroidX=true
android.enableJetifier=true
